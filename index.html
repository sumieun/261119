<!DOCTYPE html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 반 가을 그림판</title><style>*{box-sizing:border-box}body{margin:0;background:#faf3e6;color:#344d40;font:20px 'Malgun Gothic',sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 10px;font-size:34px}p{line-height:1.6}button,input,select{font:inherit}button{min-height:52px;border:1px solid #c7cdbc;border-radius:16px;padding:12px 18px;color:#344d40;background:white;cursor:pointer}button:disabled{opacity:.45;cursor:wait}button:hover,button[aria-pressed=true]{background:#f5d59f}button:focus-visible,input:focus-visible{outline:3px solid #ac6549;outline-offset:3px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.stage{background:white;border-radius:28px;border:2px solid #e3d4bb;padding:15px}canvas,svg{display:block;width:100%;height:auto;touch-action:none}small{display:block;font-size:15px;line-height:1.6;color:#63705c}.status{padding:12px;background:#e6eddc;border-radius:12px;min-height:52px}input[type=file]{max-width:100%;padding:8px;font-size:17px}@media(max-width:650px){main{padding:12px}h1{font-size:27px}button{font-size:18px;padding:10px}}</style><main>
<h1>우리 반 가을 그림판</h1><p>어떤 가을을 그려볼까요?</p><div class="bar" id="colors"></div><div class="bar"><button data-size="4">가는 붓</button><button data-size="12" aria-pressed="true">보통 붓</button><button data-size="26">굵은 붓</button><button id="eraser" aria-pressed="false">지우개</button><button id="undo">되돌리기</button><button id="clear">모두 지우기</button><button id="save">그림 PNG 저장</button></div><div class="stage"><canvas id="board" width="1000" height="530" tabindex="0" aria-label="그림판. 마우스 또는 터치로 그려요."></canvas></div><p class="status" id="status" role="status" aria-live="polite">색을 고르고 쓱쓱 그려요.</p><small>그림은 이 기기에서만 처리해요. 새로고침하면 사라져요. 마음에 드는 그림은 저장해요.</small></main><script>
"use strict";

const c=document.getElementById('board'),g=c.getContext('2d'),statusEl=document.getElementById('status');let color='#b66b4d',width=12,erase=false,drawing=false,last=null,history=[];
const colors=[['낙엽 갈색','#b66b4d'],['은행 노랑','#edbd57'],['풀 초록','#79a785'],['하늘 파랑','#87b9cd'],['열매 분홍','#d7989d'],['포도 보라','#a08db5']];
g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);
function saveState(){history.push(g.getImageData(0,0,c.width,c.height));if(history.length>15)history.shift();document.getElementById('undo').disabled=false}
colors.forEach(([name,col],i)=>{let b=document.createElement('button');b.textContent=name;b.style.borderBottom='9px solid '+col;b.setAttribute('aria-pressed',String(!i));b.onclick=()=>{color=col;erase=false;document.getElementById('eraser').setAttribute('aria-pressed','false');document.querySelectorAll('#colors button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};document.getElementById('colors').append(b)});
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{width=Number(b.dataset.size);document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
document.getElementById('eraser').onclick=e=>{erase=!erase;e.currentTarget.setAttribute('aria-pressed',String(erase))};
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function stroke(p){g.strokeStyle=erase?'#fff':color;g.lineWidth=width;g.lineCap='round';g.beginPath();g.moveTo(last.x,last.y);g.lineTo(p.x,p.y);g.stroke();last=p}
c.onpointerdown=e=>{e.preventDefault();if(drawing)return;saveState();drawing=true;last=pos(e);c.setPointerCapture(e.pointerId);stroke({x:last.x+.01,y:last.y+.01})};
c.onpointermove=e=>{if(drawing){e.preventDefault();stroke(pos(e))}};c.onpointerup=c.onpointercancel=()=>{drawing=false;last=null};
document.getElementById('undo').onclick=()=>{if(history.length)g.putImageData(history.pop(),0,0);document.getElementById('undo').disabled=!history.length};document.getElementById('undo').disabled=true;
document.getElementById('clear').onclick=()=>{if(confirm('그림을 모두 지울까요?')){saveState();g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height)}};
document.getElementById('save').onclick=()=>c.toBlob(blob=>{if(!blob){statusEl.textContent='저장이 어려워요. 화면 캡처로 남겨주세요.';return}let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='가을그림.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);statusEl.textContent='다운로드 폴더에서 그림을 확인해요.'});

</script></html>
